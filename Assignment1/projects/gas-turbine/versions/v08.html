<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a Gas Turbine Works — v08</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f0f0f0;
      padding: 48px 24px;
    }
    h1 { text-align: center; font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.02em; }
    .lead { text-align: center; color: #aaa; max-width: 520px; margin: 0 auto 40px; line-height: 1.7; }

    /* Clickable stage tabs */
    .tabs {
      max-width: 820px;
      margin: 0 auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tab {
      padding: 18px 10px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #161616;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .tab:hover { border-color: #444; background: #1c1c1c; }
    .tab.active { border-color: var(--c); background: var(--bg); }
    .tab-num { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: #555; margin-bottom: 6px; }
    .tab-name { font-size: 0.95rem; font-weight: 700; }
    .tab-hint { font-size: 0.72rem; color: #555; margin-top: 4px; }

    /* Schematic highlight area */
    .schematic-wrap {
      max-width: 820px;
      margin: 20px auto 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
    }
    .schematic-wrap img { width: 100%; display: block; }
    .overlay {
      position: absolute;
      top: 0; height: 100%;
      pointer-events: none;
      transition: opacity 0.3s;
      opacity: 0;
    }
    .overlay.visible { opacity: 1; }

    /* Detail panel */
    .detail {
      max-width: 820px;
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
      min-height: 260px;
    }
    .detail-text { padding: 8px 0; }
    .detail-tag { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .detail-text h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
    .detail-text p { color: #bbb; line-height: 1.75; font-size: 0.95rem; }
    .detail-img img { width: 100%; border-radius: 10px; display: block; max-height: 240px; object-fit: cover; }
    .detail-img .cap { font-size: 0.7rem; color: #555; margin-top: 6px; line-height: 1.4; }

    .instruction {
      max-width: 820px;
      margin: 10px auto 0;
      font-size: 0.78rem;
      color: #444;
      text-align: center;
    }

    footer { text-align: center; margin-top: 72px; padding-top: 32px; border-top: 1px solid #222; }
    footer a { color: #555; text-decoration: none; font-size: 0.9rem; }
    footer a:hover { color: #fff; }

    @media (max-width: 640px) {
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>How a Gas Turbine Works</h1>
  <p class="lead">Click a stage to explore it.</p>

  <!-- Stage tabs -->
  <div class="tabs">
    <div class="tab" data-stage="1" style="--c:#5bb8f5;--bg:#0e1e2e;" onclick="selectStage(1)">
      <div class="tab-num">Stage 1</div>
      <div class="tab-name" style="color:#5bb8f5;">Intake</div>
      <div class="tab-hint">Air drawn in</div>
    </div>
    <div class="tab" data-stage="2" style="--c:#f5d76e;--bg:#1e1c0e;" onclick="selectStage(2)">
      <div class="tab-num">Stage 2</div>
      <div class="tab-name" style="color:#f5d76e;">Compression</div>
      <div class="tab-hint">Pressure ↑ 40×</div>
    </div>
    <div class="tab" data-stage="3" style="--c:#f5824f;--bg:#1e0e08;" onclick="selectStage(3)">
      <div class="tab-num">Stage 3</div>
      <div class="tab-name" style="color:#f5824f;">Combustion</div>
      <div class="tab-hint">Fuel burns at 1,500 °C</div>
    </div>
    <div class="tab" data-stage="4" style="--c:#6fcf7a;--bg:#0e1e10;" onclick="selectStage(4)">
      <div class="tab-num">Stage 4</div>
      <div class="tab-name" style="color:#6fcf7a;">Power Out</div>
      <div class="tab-hint">Turbine spins → work</div>
    </div>
  </div>

  <!-- Annotated schematic -->
  <div class="schematic-wrap">
    <img src="../jet_engine.svg" alt="Gas turbine cross-section schematic">
    <!-- Overlays for each stage -->
    <div id="ov1" class="overlay" style="left:0%;width:14%;background:rgba(91,184,245,0.28);border-right:2px solid rgba(91,184,245,0.7);"></div>
    <div id="ov2" class="overlay" style="left:14%;width:38%;background:rgba(245,215,110,0.22);border-right:2px solid rgba(245,215,110,0.6);"></div>
    <div id="ov3" class="overlay" style="left:52%;width:20%;background:rgba(245,130,80,0.28);border-right:2px solid rgba(245,130,80,0.65);"></div>
    <div id="ov4" class="overlay" style="left:72%;width:28%;background:rgba(111,207,122,0.22);"></div>
  </div>
  <p class="instruction">↑ The highlighted zone changes as you select stages above.</p>

  <!-- Detail panel -->
  <div class="detail" id="detail">
    <!-- populated by JS -->
  </div>

  <footer><a href="../index.html">← Back to gallery</a></footer>

  <script>
    const stages = {
      1: {
        color: '#5bb8f5',
        tag: 'Stage 01 — Intake',
        title: 'Air enters the engine',
        body: 'Atmospheric air is drawn in through the inlet at the front of the engine. A large fan accelerates massive volumes of air — a commercial jet engine can swallow over 1,000 kg of air per second. The intake is carefully shaped to slow and smooth the flow before compression begins.',
        img: 'https://upload.wikimedia.org/wikipedia/commons/e/e3/Air_intake%2C_fan_and_compressor_of_sectioned_Rolls-Royce_Turbom%C3%A9ca_Adour_turbofan_01.jpg',
        cap: 'Sectioned Rolls-Royce Turbomeca Adour turbofan — intake and fan. (Wikimedia Commons / CC BY-SA)',
      },
      2: {
        color: '#f5d76e',
        tag: 'Stage 02 — Compression',
        title: 'Air is squeezed under pressure',
        body: 'Rows of rotating blades (rotors) and fixed blades (stators) progressively compress the incoming air. Pressure can rise to 40× atmospheric — the denser the air, the more energy released when the fuel ignites. Heat generated by compression also raises the temperature before combustion.',
        img: 'https://upload.wikimedia.org/wikipedia/commons/c/ca/Axial_compressor.gif',
        cap: 'Axial compressor animation — alternating rotor and stator blade rows. (Wikimedia Commons)',
      },
      3: {
        color: '#f5824f',
        tag: 'Stage 03 — Combustion',
        title: 'Fuel burns continuously',
        body: 'Fuel is injected and ignited in the combustion chamber. Unlike a car engine, combustion is continuous — a sustained flame burns at temperatures exceeding 1,500 °C. Hollow turbine blades and thermal coatings protect the hardware. The burning gas expands and accelerates toward the turbine.',
        img: 'https://upload.wikimedia.org/wikipedia/commons/6/64/Combustor_of_sectioned_Rolls-Royce_Turbom%C3%A9ca_Adour_turbofan.jpg',
        cap: 'Combustor of a sectioned Rolls-Royce Turbomeca Adour turbofan. (Wikimedia Commons / CC BY-SA)',
      },
      4: {
        color: '#6fcf7a',
        tag: 'Stage 04 — Power Extraction',
        title: 'Hot gas spins the turbine',
        body: 'The high-energy exhaust blasts through turbine blades, spinning them at thousands of RPM. The turbine drives the compressor via a shared shaft. Remaining energy becomes thrust (jet), shaft torque (helicopter / generator), or both — depending on the engine type.',
        img: 'https://upload.wikimedia.org/wikipedia/commons/e/e9/J79_GenElectr_BMW-liz_1961_%28Starfighter_F4%29_MTU-Museum_20231112_08w.jpg',
        cap: 'Three-stage turbine of a GE J79 engine at the MTU Museum. (Wikimedia Commons / CC BY-SA)',
      },
    };

    function selectStage(n) {
      // Update tabs
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-stage="${n}"]`).classList.add('active');

      // Update overlays
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`ov${i}`).classList.toggle('visible', i === n);
      }

      // Update detail panel
      const s = stages[n];
      document.getElementById('detail').innerHTML = `
        <div class="detail-text">
          <p class="detail-tag" style="color:${s.color};">${s.tag}</p>
          <h2>${s.title}</h2>
          <p>${s.body}</p>
        </div>
        <div class="detail-img">
          <img src="${s.img}" alt="${s.title}">
          <p class="cap">${s.cap}</p>
        </div>
      `;
    }

    // Default: show stage 1
    selectStage(1);
  </script>

</body>
</html>
